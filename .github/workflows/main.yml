# Release builder for whitebyte0/masscan-ng.
#
# Copy to .github/workflows/release.yml in the masscan-ng repo, then publish
# a release by pushing a tag:
#
#   git tag v1.1 && git push origin v1.1
#
# The workflow builds the scanner for Linux and Windows and attaches the
# binaries to the release under stable asset names. scan-x's updater then
# fetches them without auth or git from:
#
#   https://github.com/whitebyte0/masscan-ng/releases/latest/download/masscan-<os>-<amd64>[.exe]
#
# Asset names are a contract with scan-x's internal/updater — keep them.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make -j"$(nproc)"

      - name: Stage asset
        run: |
          # masscan's Makefile leaves the binary in bin/ or src/ depending on
          # version; find whichever appeared and stage it under the asset name.
          for cand in bin/masscan src/masscan masscan; do
            if [ -f "$cand" ]; then mv "$cand" masscan-linux-amd64; break; fi
          done
          [ -f masscan-linux-amd64 ] || { echo "built binary not found" >&2; exit 1; }

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: masscan-linux-amd64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-toolchain

      - name: Build
        shell: msys2 {0}
        run: make -j"$(nproc)"

      - name: Stage asset
        shell: bash
        run: |
          for cand in bin/masscan.exe src/masscan.exe masscan.exe; do
            if [ -f "$cand" ]; then mv "$cand" masscan-windows-amd64.exe; break; fi
          done
          [ -f masscan-windows-amd64.exe ] || { echo "built binary not found" >&2; exit 1; }

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: masscan-windows-amd64.exe